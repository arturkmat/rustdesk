name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      artifacts-only:
        description: Upload Windows and Android artifacts without publishing a release
        type: boolean
        default: false

jobs:
  check-secrets:
    if: ${{ inputs.artifacts-only }}
    runs-on: ubuntu-latest
    steps:
      - name: Require server secrets
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
          API_SERVER: ${{ secrets.API_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          missing=0
          for name in RENDEZVOUS_SERVER RELAY_SERVER API_SERVER RS_PUB_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "Server secrets are present."

  run-ci:
    if: ${{ !inputs.artifacts-only }}
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false

  run-artifacts:
    if: ${{ inputs.artifacts-only }}
    needs: [check-secrets]
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      publish-release: false
      publish-update-metadata: false
      upload-tag: pr-artifacts
