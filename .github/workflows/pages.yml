name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - cursor/custom-installers-branding-b151
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Publish pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          force_orphan: true

      - name: Serve site from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api repos/${{ github.repository }}/pages >/dev/null 2>&1; then
            echo "$payload" | gh api --method PUT repos/${{ github.repository }}/pages --input -
          else
            echo "$payload" | gh api --method POST repos/${{ github.repository }}/pages --input -
          fi
